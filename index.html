<script>
  // 先定主题，避免首屏闪一下
  try {
    const pref = new URLSearchParams(location.search).get("theme");
    const saved = pref === "light" || pref === "dark" ? pref : localStorage.getItem("wwh-theme");
    const light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.dataset.uiTheme = light ? "light" : "dark";
  } catch (_) {}
</script>
<style>
:root {
  --bg: #0e1013;
  --side: #0b0d10;
  --panel: #14171c;
  --raise: #1b1f26;
  --fg: #e9ecef;
  --muted: #959ca6;
  --faint: #6a717b;
  --accent: #7de2c4;
  --accent-soft: rgba(var(--accent-rgb), 0.12);
  --accent-ink: #0b1512;
  --danger: #ff7b6e;
  --warn: #ffb547;
  --warn-ink: #1d1405;
  --warn-rgb: 255, 181, 71;
  --tint: 255, 255, 255;
  --line: rgba(var(--tint), 0.07);
  --line-strong: rgba(var(--tint), 0.12);
  --accent-rgb: 125, 226, 196;
  --sh-thumb: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.32));
  --r-lg: 14px;
  --r-md: 10px;
  --r-sm: 7px;
  --text: "Segoe UI Variable Text", "Segoe UI", "Microsoft JhengHei UI", "Microsoft YaHei UI", sans-serif;
  --num: "Cascadia Mono", Consolas, monospace;
  --slide: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}
:root[data-ui-theme="light"] {
  --bg: #f1f2f4;
  --side: #fbfbfc;
  --panel: #ffffff;
  --raise: #eceef1;
  --fg: #15181d;
  --muted: #5b626b;
  --faint: #868d97;
  --accent: #0b8f73;
  --accent-soft: rgba(11, 143, 115, 0.1);
  --accent-ink: #ffffff;
  --danger: #c5352a;
  --warn: #93560a;
  --warn-ink: #ffffff;
  --warn-rgb: 147, 86, 10;
  --tint: 17, 21, 27;
  --line: rgba(var(--tint), 0.1);
  --line-strong: rgba(var(--tint), 0.16);
  --accent-rgb: 11, 143, 115;
  --sh-thumb: drop-shadow(0 6px 12px rgba(17, 21, 27, 0.12));
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid;
  grid-template-columns: 216px 1fr;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── 侧栏：和客户端同一套语言，但不放客户端里才有的入口 ── */
.side {
  background: var(--side);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 18px 12px 14px;
  min-height: 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 6px; }
.logo { width: 30px; height: 30px; flex: none; }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
.brand-sub { font-size: 12px; color: var(--faint); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  height: 34px; padding: 0 12px; border-radius: var(--r-sm);
  color: var(--muted); text-decoration: none; font-size: 13px;
  transition: background 0.15s, color 0.15s;
}
.nav a:hover { background: rgba(var(--tint), 0.05); color: var(--fg); }
.nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--faint); padding: 0 8px; line-height: 1.7; }
.side-foot b { color: var(--muted); font-weight: 600; }
.side-foot a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(var(--tint), 0.2); }

/* ── 主区 ── */
.main { min-height: 0; overflow-y: auto; padding: 26px 26px 34px; scrollbar-width: thin; }
.wrap { max-width: 1180px; margin: 0 auto; }

.page-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; min-height: 34px; }
.page-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.01em; }
.page-head .sub { color: var(--muted); font-size: 13px; margin-left: 8px; font-weight: 400; }
.head-tools { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border: 1px solid var(--line-strong);
  border-radius: var(--r-sm); background: transparent; color: var(--fg);
  font-size: 13px; white-space: nowrap; text-decoration: none;
  transition: background 0.15s, border-color 0.15s, transform 0.12s;
}
.btn:hover { background: rgba(var(--tint), 0.05); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.quiet { border-color: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--fg); background: rgba(var(--tint), 0.05); }
.btn.small { height: 26px; padding: 0 9px; font-size: 12px; }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.link { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(var(--tint), 0.2); }
.link:hover { color: var(--fg); }

.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 10px; width: 15px; height: 15px; fill: none; stroke: var(--faint); stroke-width: 1.8; stroke-linecap: round; pointer-events: none; }
.field, .select {
  height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: rgba(var(--tint), 0.04); outline: none; color: var(--fg);
}
.field:focus, .select:focus { border-color: rgba(var(--accent-rgb), 0.6); }
.field::placeholder { color: var(--faint); }
.search .field { width: 220px; padding-left: 32px; }
.select { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 14px) 14px, calc(100% - 9px) 14px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; cursor: pointer; }

.cats { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 99px; background: transparent;
  color: var(--muted); font-size: 13px; white-space: nowrap;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.chip .num { font-size: 11.5px; color: var(--faint); }
.chip:hover { color: var(--fg); border-color: var(--line-strong); }
.chip.on { background: var(--accent-soft); border-color: rgba(var(--accent-rgb), 0.28); color: var(--accent); font-weight: 600; }
.chip.on .num { color: inherit; opacity: 0.75; font-weight: 400; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; align-content: start; }
.none { grid-column: 1 / -1; padding: 44px 0; text-align: center; color: var(--muted); font-size: 13.5px; }
.note { grid-column: 1 / -1; padding: 10px 14px; border-radius: var(--r-md); background: rgba(var(--warn-rgb, 255, 181, 71), 0.08); color: var(--warn); font-size: 13px; }

.card {
  display: flex; flex-direction: column; gap: 10px; padding: 16px;
  border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line);
  transition: border-color 0.2s, transform 0.2s var(--slide);
  animation: card-in 0.45s var(--slide) both;
}
.card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
@keyframes card-in { from { opacity: 0; transform: translateY(8px); } }
.card-top { display: flex; align-items: center; gap: 12px; }
.card h3 { margin: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .by { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55; min-height: 2.9em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .perm {
  font-size: 12px; color: var(--muted); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .perm.quiet { color: var(--faint); }
.card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--faint); }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 2px; }

.thumb {
  display: grid; place-items: center; height: 146px; margin: -6px -6px 2px; padding: 12px;
  border-radius: 10px; overflow: hidden;
  background:
    radial-gradient(90% 80% at 88% 100%, rgba(52, 120, 255, 0.55), transparent 65%),
    radial-gradient(70% 60% at 10% 0%, rgba(20, 50, 140, 0.5), transparent 70%),
    linear-gradient(150deg, #050a1a, #0b1d4d 55%, #15368c);
}
.thumb img { width: 100%; height: 100%; min-height: 0; object-fit: contain; filter: var(--sh-thumb); transition: transform 0.3s var(--slide); }
.card.has-thumb p { min-height: 0; }
.card.has-thumb:hover .thumb img { transform: scale(1.03); }
.tile { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; overflow: hidden; flex: none; }
.tile img { width: 24px; height: 24px; }
.tile.letter { font: 600 16px/1 var(--num); color: var(--accent); text-transform: uppercase; }

.status { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 12px; color: var(--faint); }
.status a { color: var(--muted); }

.none button { margin-top: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

@media (max-width: 900px) {
  body { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding: 18px 16px 28px; }
  .search .field { width: 100%; }
  .head-tools { width: 100%; margin-left: 0; }
  .search { flex: 1 1 100%; }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
}
@media (max-width: 620px) {
  .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .thumb { height: 108px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .thumb img { animation: none; transition: none; }
}
</style>
</head>

<noscript><div class="main"><p>这个页面需要 JavaScript 才能读取组件清单。</p></div></noscript>

<script>
(() => {
  "use strict";

  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const LIST_URL = "./widgets.json";
  const FALLBACK_URL = "https://demon1110.github.io/WinWidgetHub/widgets.json";
  const REPO = "https://github.com/Demon1110/WinWidgetHub";

  const CATS = [
    ["time", "时间"],
    ["weather", "天气"],
    ["system", "系统"],
    ["productivity", "效率"],
    ["info", "资讯"],
    ["media", "媒体"],
    ["other", "其他"],
  ];
  const CAT_LABEL = Object.fromEntries(CATS);

  const PERMS = {
    system: "系统信息",
    notify: "通知",
    audio: "声音",
    media: "媒体控制",
    clipboard: "剪贴板",
    screen: "屏幕截图",
    input: "输入模拟",
    schedule: "定时任务",
    sharp: "图片处理",
    ubrowser: "内置浏览器",
    "shell.open": "打开网址",
    "shell.launch": "打开程序",
    "shell.drop": "拖放文件",
    "tool.exec": "第三方工具",
  };

  const state = { data: null, error: "", loading: true, q: "", cat: null, sort: "updated" };

  function permName(p) {
    if (typeof p !== "string") return String(p);
    if (p.startsWith("network:")) return "网络 " + p.slice("network:".length);
    return PERMS[p] || p;
  }

  function kb(n) {
    const v = Number(n) || 0;
    if (v < 1024) return `${v} B`;
    if (v < 1048576) return `${Math.round(v / 1024)} KB`;
    return `${(v / 1048576).toFixed(1)} MB`;
  }

  function cmpVer(a, b) {
    const part = (v) => String(v).split(/[-+]/)[0].split(".").map((x) => parseInt(x, 10) || 0);
    const x = part(a), y = part(b);
    for (let i = 0; i < Math.max(x.length, y.length); i++) {
      const d = (x[i] || 0) - (y[i] || 0);
      if (d) return Math.sign(d);
    }
    return 0;
  }

  /** 和客户端一样：模板按「主题.语言」挑一张，挑不到就用列表里的第一张。 */
  function previewOf(w) {
    if (!w) return null;
    const template = w.preview || (Array.isArray(w.previews) && w.previews[0]) || null;
    if (!template) return null;
    if (!String(template).includes("{")) return template;
    const have = new Set(w.previews || []);
    const tries = ["zh-CN", "zh-TW", "en"].map((lang) => template.replace("{theme}", "instrument").replace("{lang}", lang));
    return tries.find((u) => have.has(u)) || (w.previews && w.previews[0]) || null;
  }

  function categoriesOf(list) {
    const counts = new Map();
    for (const w of list) {
      const c = CAT_LABEL[w.category] ? w.category : "other";
      counts.set(c, (counts.get(c) || 0) + 1);
    }
    return CATS.filter(([c]) => counts.has(c)).map(([c, label]) => [c, label, counts.get(c)]);
  }

  function sorted(filtered) {
    const byUpdated = (a, b) => String(b.updated || "").localeCompare(String(a.updated || "")) || String(a.name).localeCompare(String(b.name), "zh-CN");
    switch (state.sort) {
      case "name": return [...filtered].sort((a, b) => String(a.name).localeCompare(String(b.name), "zh-CN"));
      case "size": return [...filtered].sort((a, b) => (Number(b.bytes) || 0) - (Number(a.bytes) || 0));
      case "version": return [...filtered].sort((a, b) => cmpVer(b.version, a.version) || byUpdated(a, b));
      default: return [...filtered].sort(byUpdated);
    }
  }

  function card(w, i) {
    const img = previewOf(w);
    const thumb = img
      ? `<div class="thumb"><img src="${esc(img)}" alt="" loading="lazy" draggable="false"></div>`
      : "";
    const icon = w.icon
      ? `<span class="tile"><img src="${esc(w.icon)}" alt="" loading="lazy"></span>`
      : `<span class="tile letter">${esc(String(w.name || w.id).slice(0, 1))}</span>`;
    const perms = Array.isArray(w.permissions) && w.permissions.length
      ? `<div class="perm" title="${esc(w.permissions.map(permName).join("、"))}">需要：${esc(w.permissions.map(permName).join("、"))}</div>`
      : `<div class="perm quiet">不需要任何权限</div>`;
    const author = w.author ? esc(w.author) : "第三方";
    return `<article class="card${img ? " has-thumb" : ""}" style="animation-delay:${Math.min(i, 12) * 18}ms">
      ${thumb}
      <div class="card-top">${img ? "" : icon}<div style="min-width:0">
        <h3 title="${esc(w.name)}">${esc(w.name || w.id)}</h3>
        <div class="by">${author} · <span class="num">v${esc(w.version || "")}</span></div>
      </div></div>
      <p>${esc(w.description || "")}</p>
      ${perms}
      <div class="meta"><span class="num">${esc(w.updated || "")}</span><span class="num">${kb(w.bytes)}</span></div>
      <div class="card-foot">
        <a class="btn primary small" href="${esc(w.download || "#")}" download>下载 .fwz</a>
        <a class="link" href="${esc(w.page || REPO)}" target="_blank" rel="noopener">源码</a>
      </div>
    </article>`;
  }

  function renderCats() {
    const all = (state.data && state.data.widgets) || [];
    const cats = categoriesOf(all);
    const chips = [[null, "全部", all.length], ...cats];
    $("#cats").innerHTML = all.length
      ? chips.map(([c, label, n]) => `<button class="chip${(state.cat || null) === c ? " on" : ""}" type="button" data-cat="${c || ""}">${esc(label)}<span class="num">${n}</span></button>`).join("")
      : "";
    $("#cats").hidden = !all.length;
  }

  function renderGallery() {
    const gallery = $("#gallery");
    if (state.loading) { gallery.innerHTML = `<div class="none">正在读取组件清单…</div>`; return; }
    if (state.error) {
      gallery.innerHTML = `<div class="none">连不上组件清单：${esc(state.error)}<br><button class="btn small" type="button" id="retry">重试</button></div>`;
      return;
    }
    const all = (state.data && state.data.widgets) || [];
    if (!all.length) { gallery.innerHTML = `<div class="none">市场里还没有组件。</div>`; return; }

    const words = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const found = all.filter((w) => {
      if (state.cat && (CAT_LABEL[w.category] ? w.category : "other") !== state.cat) return false;
      const hay = `${w.id || ""} ${w.name || ""} ${w.description || ""} ${w.author || ""}`.toLowerCase();
      return words.every((x) => hay.includes(x));
    });
    const list = sorted(found);
    gallery.innerHTML = list.length
      ? list.map(card).join("")
      : `<div class="none">没有名称或说明含「${esc(state.q.trim())}」的组件</div>`;
  }

  function renderStatus() {
    const all = (state.data && state.data.widgets) || [];
    const total = all.length;
    const newest = all.reduce((m, w) => (String(w.updated || "") > m ? String(w.updated || "") : m), "");
    const found = state.q || state.cat;
    $("#count-sub").textContent = state.loading ? "正在读取…" : state.error ? "读取失败" : `${total} 个组件`;
    $("#side-count").textContent = state.loading || state.error ? "—" : String(total);
    $("#side-date").textContent = newest || "—";
    $("#status-left").textContent = state.loading
      ? ""
      : state.error
        ? "清单读取失败"
        : found
          ? `筛选后 ${$("#gallery").querySelectorAll(".card").length} / ${total} 个`
          : `共 ${total} 个组件`;
  }

  function render() {
    renderCats();
    renderGallery();
    renderStatus();
  }

  async function load(refresh) {
    state.loading = true;
    state.error = "";
    render();
    const urls = refresh ? [`${LIST_URL}?t=${Date.now()}`, FALLBACK_URL] : [LIST_URL, FALLBACK_URL];
    let lastErr = "";
    for (const url of urls) {
      try {
        const res = await fetch(url, { cache: refresh ? "no-store" : "default" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!Array.isArray(data.widgets)) throw new Error("清单里没有 widgets 数组");
        state.data = data;
        state.loading = false;
        state.error = "";
        render();
        return;
      } catch (e) {
        lastErr = e && e.message ? e.message : String(e);
      }
    }
    state.loading = false;
    state.error = lastErr || "未知错误";
    render();
  }

  $("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("#refresh").addEventListener("click", () => load(true));
  $("#gallery").addEventListener("click", (e) => {
    if (e.target && e.target.id === "retry") load(true);
  });
  $("#cats").addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    state.cat = btn.dataset.cat || null;
    render();
  });

  // 明暗主题
  function paintTheme() {
    const light = document.documentElement.dataset.uiTheme === "light";
    $("#theme").title = light ? "切换到深色" : "切换到浅色";
  }
  $("#theme").addEventListener("click", () => {
    const next = document.documentElement.dataset.uiTheme === "light" ? "dark" : "light";
    document.documentElement.dataset.uiTheme = next;
    try { localStorage.setItem("wwh-theme", next); } catch (_) {}
    paintTheme();
  });
  paintTheme();

  load(false);
})();
</script>
</body>
</html>
