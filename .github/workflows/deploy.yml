name: 发布 Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 组件日期取自 git log
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查源码和打包产物
        run: node scripts/check.mjs
      - name: 收集要发布的文件
        run: |
          mkdir -p _site
          cp widgets.json _site/
          cp -r widgets _site/
          cp -r src _site/
          cp .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
