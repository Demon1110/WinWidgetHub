<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="partner" id="partner"><span class="who">对家</span><span class="count w-num">0</span></div>
  <div class="seats">
    <div class="seat" id="seat-left"><span class="who">上家</span><span class="count w-num">0</span></div>
    <div class="level" id="level">打 2</div>
    <div class="seat" id="seat-right"><span class="who">下家</span><span class="count w-num">0</span></div>
  </div>

  <div class="table" id="table">
    <div class="played" id="played"></div>
    <div class="say" id="say"></div>
  </div>

  <div class="hand" id="hand"></div>

  <div class="controls">
    <button id="hint" class="w-btn" type="button">提示</button>
    <button id="pass" class="w-btn" type="button">不要</button>
    <button id="play" class="w-btn is-primary" type="button" disabled>出牌</button>
  </div>

  <div class="over" id="over" hidden>
    <div class="over-card">
      <div class="over-title" id="overTitle"></div>
      <div class="over-body" id="overBody"></div>
      <button id="again" class="w-btn is-primary" type="button">再来一局</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
