<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="br">
    <header class="top">
      <div class="brand">
        <span class="brandmark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="11" height="14" rx="2"/><rect x="9" y="6.5" width="11" height="14" rx="2"/><path d="M12 11.5h5M12 15h5M6.5 8.5h5"/></svg>
        </span>
        <span class="titles">
          <span class="title" id="title"></span>
          <span class="sub" id="sub"></span>
        </span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="undoBtn" type="button" title="撤销上次" aria-label="撤销上次" hidden>
          <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h9a6 6 0 0 1 6 6v1"/></svg>
        </button>
        <button class="icon-btn" id="pasteBtn" type="button" title="从剪贴板添加" aria-label="从剪贴板添加">
          <svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/><path d="M9 5V3.5h6V5"/></svg>
        </button>
        <button class="icon-btn" id="addBtn" type="button" title="添加文件" aria-label="添加文件">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="clearBtn" type="button" title="清空" aria-label="清空">
          <svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M8 7l1 13h6l1-13"/></svg>
        </button>
      </div>
    </header>

    <p class="hint" id="hint"></p>

    <section class="rules" aria-label="重命名规则">
      <div class="grid2">
        <label class="field"><span id="lblPrefix"></span><input id="prefix" maxlength="80" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span id="lblSuffix"></span><input id="suffix" maxlength="80" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span id="lblFind"></span><input id="find" maxlength="80" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span id="lblReplace"></span><input id="replace" maxlength="80" autocomplete="off" spellcheck="false"></label>
      </div>
      <div class="chips">
        <button class="chip" id="regexBtn" type="button" aria-pressed="false">.*</button>
        <button class="chip" id="caseBtn" type="button" aria-pressed="false">Aa</button>
        <button class="chip" id="numBtn" type="button" aria-pressed="false">#</button>
        <label class="mini"><span id="lblCase"></span><select id="caseMode"></select></label>
        <label class="mini"><span id="lblExt"></span><select id="extMode"></select></label>
        <label class="mini"><span id="lblOrder"></span><select id="orderMode"></select></label>
      </div>
      <div class="numrow" id="numRow" hidden>
        <label class="mini"><span id="lblStart"></span><input id="numStart" type="number" min="0" step="1" value="1"></label>
        <label class="mini"><span id="lblStep"></span><input id="numStep" type="number" min="1" step="1" value="1"></label>
        <label class="mini"><span id="lblPad"></span><select id="numPad"></select></label>
        <label class="mini"><span id="lblPos"></span><select id="numPos"></select></label>
      </div>
    </section>

    <div class="listhead">
      <button class="check" id="checkAll" type="button" role="checkbox" aria-checked="false" aria-label="全选">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 6.8"/></svg>
      </button>
      <span class="filelabel" id="fileLabel"></span>
      <span class="count" id="count"></span>
    </div>

    <div class="list" id="fileList"></div>
    <div class="empty" id="empty" hidden>
      <span class="dropicon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/><path d="M12 4v11M7.5 8.5L12 4l4.5 4.5"/></svg>
      </span>
      <span id="emptyText"></span>
    </div>

    <footer class="bottom">
      <span class="status" id="status"></span>
      <button class="w-btn" id="copyCmd" type="button"></button>
      <button class="w-btn is-primary" id="applyBtn" type="button"></button>
    </footer>

    <section class="confirm" id="confirmPanel" hidden>
      <div class="confirmcard">
        <strong id="confirmTitle"></strong>
        <p id="confirmText"></p>
        <div class="confirmbtns">
          <button class="w-btn" id="cancelApply" type="button"></button>
          <button class="w-btn is-primary" id="doApply" type="button"></button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" hidden></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
