<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多彩面板</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="skin.css">
</head>
<body>
  <div class="card" id="card">
    <main class="content">
      <section class="panels" id="panels">
        <article class="tile storage" id="storageTile">
          <span class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="14.5" r="1.4" fill="currentColor"/></svg>
          </span>
          <b class="tile-value" id="storageValue">101.2GB</b>
          <span class="tile-label" id="storageLabel">剩余容量</span>
        </article>

        <article class="tile clock" id="clockTile">
          <span class="clock-kicker">NOW</span>
          <b class="clock-value" id="clockValue">14:52</b>
          <span class="clock-date" id="clockDate">11/22 星期日</span>
        </article>

        <article class="tile battery" id="batteryTile">
          <span class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="3.5" width="12" height="17" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M9 2h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 7.5l-3 4h3l-1 4 3.6-4.8h-3.1Z" fill="currentColor"/></svg>
          </span>
          <b class="tile-value" id="batteryValue">20%</b>
          <span class="tile-label" id="batteryLabel">剩余电量</span>
        </article>
      </section>

      <section class="weather" id="weather" aria-label="天气">
        <div class="weather-main">
          <span class="weather-city" id="weatherCity">本地天气</span>
          <div class="weather-now">
            <b id="weatherTemp">30°</b>
            <span id="weatherText">阴天</span>
          </div>
          <span class="weather-meta" id="weatherMeta">湿度 54% · 空气 优质</span>
        </div>
        <div class="weather-forecast" id="weatherForecast"></div>
      </section>
    </main>
  </div>

  <script>
    window.SKIN_DEFAULTS = { skin: "paper", backgroundOpacity: 100, accent: "#F4C542", radius: 24, fontFamily: null };
  </script>
  <script src="main.js"></script>
  <script src="skin.js"></script>
</body>
</html>
