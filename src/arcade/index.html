<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="head">
    <div class="tabs">
      <button type="button" class="tab" data-game="snake" aria-pressed="true"></button>
      <button type="button" class="tab" data-game="breakout" aria-pressed="false"></button>
      <button type="button" class="tab" data-game="mines" aria-pressed="false"></button>
    </div>
    <span class="w-num score" id="score">0</span>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" width="320" height="320"></canvas>
    <div class="mines" id="mines" hidden></div>
    <div class="over" id="over" hidden>
      <b id="over-text"></b>
      <button type="button" class="w-btn is-primary" id="over-again"></button>
    </div>
  </div>
  <div class="hint" id="hint"></div>
  <script src="main.js"></script>
</body>
</html>
