<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="score">
      <span class="w-label" id="label-score"></span>
      <b class="w-display" id="score">0</b>
    </div>
    <div class="score best">
      <span class="w-label" id="label-best"></span>
      <b class="w-num" id="best">0</b>
    </div>
    <button type="button" class="w-btn" id="again"></button>
  </header>
  <div class="board" id="board">
    <div class="over" id="over" hidden>
      <b id="over-text"></b>
      <button type="button" class="w-btn" id="over-again"></button>
    </div>
  </div>
  <div class="hint" id="hint"></div>
  <script src="main.js"></script>
</body>
</html>
