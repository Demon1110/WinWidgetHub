<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="rows">
    <button type="button" class="row" data-key="name">
      <span class="w-label" id="label-name"></span>
      <b class="value" id="value-name"></b>
    </button>
    <button type="button" class="row" data-key="id">
      <span class="w-label" id="label-id"></span>
      <b class="value w-num" id="value-id"></b>
    </button>
    <button type="button" class="row" data-key="phone">
      <span class="w-label" id="label-phone"></span>
      <b class="value w-num" id="value-phone"></b>
    </button>
    <button type="button" class="row" data-key="card">
      <span class="w-label" id="label-card"></span>
      <b class="value w-num" id="value-card"></b>
    </button>
  </div>
  <div class="foot">
    <span class="toast" id="toast" hidden></span>
    <button type="button" class="w-btn" id="again"></button>
  </div>
  <script src="main.js"></script>
</body>
</html>
