<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="float.css">
</head>
<body class="float-body">
  <main class="float-card">
    <header>
      <div>
        <div class="float-eyebrow" id="floatEyebrow">DESKTOP</div>
        <div class="float-title" id="floatTitle">接下来</div>
      </div>
      <button class="float-close" id="floatClose" type="button" title="收起">×</button>
    </header>

    <ul class="float-list" id="floatList"></ul>
    <div class="float-empty" id="floatEmpty">桌面是空的，先喘口气。</div>

    <footer>
      <button class="float-open" id="floatOpen" type="button">打开完整列表</button>
    </footer>
  </main>
  <script src="float.js"></script>
</body>
</html>
