<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="alert.css">
</head>
<body class="alert-body">
  <main class="alert-card">
    <div class="alert-head">
      <span class="alert-eyebrow" id="alertEyebrow">提醒时间到了</span>
      <button class="alert-close" id="alertClose" type="button" title="关闭" aria-label="关闭">×</button>
    </div>
    <h1 class="alert-title" id="alertTitle">提醒</h1>
    <p class="alert-note" id="alertNote"></p>
    <div class="alert-meta">
      <span id="alertTime"></span>
      <span class="alert-repeat" id="alertRepeat"></span>
    </div>
    <div class="alert-actions">
      <button class="alert-quiet" id="alertDismiss" type="button">知道了</button>
      <button class="alert-primary" id="alertDone" type="button">完成</button>
    </div>
  </main>
  <script src="alert.js"></script>
</body>
</html>
